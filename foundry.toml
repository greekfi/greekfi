[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
via_ir = true
optimizer = true
optimizer_runs = 200
solc = "0.8.35"
evm_version = "osaka"

[lint]
exclude_lints = ["unsafe-cheatcode", "unwrapped-modifier-logic", "unsafe-typecast"]

[fmt]
line_length = 140
tab_width = 4
quote_style = "double"
bracket_spacing = true
int_types = "long"

# See more config options https://book.getfoundry.sh/reference/config/overview
